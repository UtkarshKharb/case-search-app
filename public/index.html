<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FERA/FEMA Case Search</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="page-header">
    <h1>FERA/FEMA Case Search</h1>
    <p class="subtitle">Find a court case by its CNR (Case Number Record)</p>
  </header>

  <main>
    <section class="search-panel">
      <form id="search-form" novalidate>
        <input
          id="cnr-input"
          type="text"
          placeholder="Enter 16-character CNR, e.g. HCBM010003411990"
          maxlength="16"
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>
      <p id="search-error" class="error-message" hidden></p>
    </section>

    <section id="case-detail" class="case-detail" hidden></section>

    <section class="browse-panel">
      <h2>Browse sampled cases</h2>
      <p class="hint">No CNR handy? Click a case below.</p>
      <div id="case-list" class="case-list">
        <p class="loading">Loading cases…</p>
      </div>
    </section>
  </main>

  <script src="/vendor/axios.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
