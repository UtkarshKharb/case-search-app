<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Causa Analytica</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // Set the theme before first paint to avoid a flash of the wrong theme.
    // app.js re-applies the same logic later (and owns the toggle button),
    // this is just the fast pre-load path.
    (function () {
      var stored = localStorage.getItem('causa-analytica-theme');
      var theme =
        stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <nav class="site-nav">
    <a href="#/" class="nav-wordmark" id="nav-wordmark">Causa Analytica</a>
    <div class="nav-links">
      <a href="#/cases" class="nav-link" id="nav-cases-link">All Cases</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme">
        <span class="theme-icon theme-icon-dark" aria-hidden="true">&#9789;</span>
        <span class="theme-icon theme-icon-light" aria-hidden="true">&#9728;</span>
      </button>
    </div>
  </nav>

  <main id="view-root"></main>

  <script src="/vendor/axios.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
